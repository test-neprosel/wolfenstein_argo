apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wolfenstein
  namespace: wolfenstein
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  ingressClassName: nginx
  rules:
    - host: wolfenstein.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wolfenstein
                port:
                  number: 80
